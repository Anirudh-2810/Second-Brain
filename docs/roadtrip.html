<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roadtrip Focus — Drive into deep work</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "framer-motion": "https://esm.sh/framer-motion@10.16.4?external=react",
    "gsap": "https://esm.sh/gsap@3.12.5",
    "pixi.js": "https://esm.sh/pixi.js@7.4.2",
    "lottie-web": "https://esm.sh/lottie-web@5.12.2"
  }
}
</script>
<style>
  :root{--bg:#070a0e;--surface:#0f1419;--surface2:#141b22;--outline:#1e2a33;--text:#e6f0e6;--muted:#7a8a7a;--accent:#00e69a;--accent2:#6ae8b5;--card:#0f1419;--r:12px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,Inter,Arial,sans-serif;overflow:hidden}
  #root{height:100%;display:flex;flex-direction:column}
  header{padding:12px 16px 8px;text-align:center}
  header h1{margin:0;font-size:18px;letter-spacing:1.2px;color:var(--accent);font-weight:800}
  header p{margin:2px 0 0;color:var(--muted);font-size:11px}
  .phase{margin-top:4px;color:#9ab0a0;font-size:12px}
  .canvas-wrap{flex:1;position:relative;margin:6px 12px;background:#0a0a0a;border-radius:var(--r);overflow:hidden;border:1px solid var(--outline)}
  canvas{width:100%;height:100%;display:block}
  .hud{position:absolute;inset:0;pointer-events:none}
  .hud-card{position:absolute;background:rgba(15,20,25,0.88);backdrop-filter:blur(6px);border:1px solid var(--outline);border-radius:10px;padding:6px 10px;display:flex;gap:8px;align-items:center;pointer-events:auto}
  .hud-top{top:12px;left:50%;transform:translateX(-50%);min-width:520px;max-width:90%;justify-content:space-between}
  .hud-bottom{bottom:12px;left:50%;transform:translateX(-50%);min-width:640px;max-width:92%;justify-content:space-between}
  .intent{flex:1;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--outline);border-radius:8px;padding:6px 10px;margin:8px 12px}
  .intent label{color:var(--muted);font-weight:700;font-size:12px;min-width:44px}
  .intent input{flex:1;background:var(--surface);border:1px solid var(--outline);color:var(--text);border-radius:6px;padding:6px 8px;outline:none}
  .intent input:focus{border-color:var(--accent)}
  .route{margin:0 12px 6px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--outline);border-radius:8px;padding:8px 12px}
  .route select{background:var(--surface2);color:var(--text);border:1px solid var(--outline);border-radius:6px;padding:4px 8px}
  .timer-row{display:flex;gap:12px;margin:6px 12px;align-items:stretch}
  .time-card{flex:0 0 220px;background:var(--surface);border:1px solid var(--outline);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
  .time{font-family:Consolas,monospace;font-size:36px;font-weight:800;color:var(--accent);letter-spacing:1px}
  .cap{color:var(--muted);font-size:11px}
  .progress-card{flex:1;background:var(--surface);border:1px solid var(--outline);border-radius:10px;padding:12px;display:flex;flex-direction:column;justify-content:center}
  .bar{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--outline)}
  .fill{height:100%;background:var(--accent);width:0%}
  .controls{display:flex;gap:8px;justify-content:center;margin:8px 12px}
  .btn{padding:8px 14px;border-radius:8px;border:1px solid var(--outline);background:var(--surface);color:var(--text);cursor:pointer;font-weight:700}
  .btn.primary{background:var(--accent);color:#00140e;border-color:var(--accent)}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  .sound{display:flex;gap:8px;align-items:center;justify-content:center;margin:4px 12px;color:var(--muted);font-size:12px}
  .sound input[type=range]{width:120px}
  .quick{display:flex;gap:6px;justify-content:center;margin:4px 12px}
  .pill{padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--outline);color:var(--text);cursor:pointer;font-size:12px}
  .pill.active{background:var(--accent);color:#00140e;border-color:var(--accent)}
  .quote{text-align:center;color:var(--muted);font-style:italic;font-size:12px;margin:8px 12px}
  .stats{display:flex;justify-content:space-between;align-items:center;margin:6px 12px 8px;color:var(--muted);font-size:11px}
  .stats button{padding:4px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--outline);color:var(--accent);cursor:pointer}
  .topbar{position:absolute;top:8px;right:12px;display:flex;gap:6px;z-index:5}
  .topbar button{padding:6px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--outline);color:var(--text);cursor:pointer;font-size:12px;font-weight:700}
  .mini-car{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:28px;height:16px;pointer-events:none}
  @media (max-width:700px){.timer-row{flex-direction:column}.time-card{flex:1}.hud-top,.hud-bottom{min-width:90%}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React, {useEffect, useRef, useState, useMemo} from "react"
import {createRoot} from "react-dom/client"
import {motion, AnimatePresence, useMotionValue, useSpring} from "framer-motion"
import gsap from "gsap"
import * as PIXI from "pixi.js"
import lottie from "lottie-web"

const ROUTES = [
  ["Coastal Hop",25,"Quick sprint — one focused stretch"],
  ["Desert Stretch",50,"Deep work block — stay with it"],
  ["Mountain Pass",90,"Long haul — settle in"],
  ["Cross-Country",120,"Marathon — the scenic way"],
]
const SCENERY_SPEED = 18
const THEME = {bg:"#070a0e", surface:"#0f1419", outline:"#1e2a33", accent:"#00e69a", muted:"#7a8a7a"}

function useCurve(seed){
  return useMemo(()=>{
    // simple deterministic random
    let s = seed
    const rnd = ()=> (s = (s*16807)%2147483647, (s-1)/2147483646)
    return [42+rnd()*26, 14+rnd()*12, 0.028+rnd()*0.02, 0.11+rnd()*0.06, rnd()*6.28, rnd()*6.28]
  },[seed])
}

function App(){
  const [intent,setIntent] = useState("")
  const [routeName,setRouteName] = useState(ROUTES[0][0])
  const [routeMin,setRouteMin] = useState(ROUTES[0][1])
  const [remaining,setRemaining] = useState(ROUTES[0][1]*60)
  const [total,setTotal] = useState(ROUTES[0][1]*60)
  const [isRunning,setIsRunning] = useState(false)
  const [isPaused,setIsPaused] = useState(false)
  const [dist,setDist] = useState(0)
  const [seed,setSeed] = useState(Math.random())
  const [isFullscreen,setIsFullscreen] = useState(false)
  const canvasRef = useRef(null)
  const progress = total? (total-remaining)/total : 0
  const distMotion = useMotionValue(0)
  const smoothDist = useSpring(distMotion, {stiffness:90, damping:18})
  const params = useCurve(seed)
  const roadCenter = (d)=> params[0]*Math.sin(d*params[2]+params[4]) + params[1]*Math.sin(d*params[3]+params[5])
  const persp = (t)=> 1 - Math.pow(1-t,1.65)

  // GSAP ticker for dash
  const dashPhase = useRef({v:0})
  useEffect(()=>{ const t=gsap.ticker.add(()=>{ dashPhase.current.v = (dashPhase.current.v + 0.016*0.09*SCENERY_SPEED)%1 }); return ()=>gsap.ticker.remove(t) },[])

  // timer loop
  useEffect(()=>{
    if(!isRunning || isPaused) return
    const id=setInterval(()=> setRemaining(r=>{ if(r<=1){ setIsRunning(false); onFinish(); return 0 } return r-1 }),1000)
    return ()=>clearInterval(id)
  },[isRunning,isPaused,total])

  // smooth dist
  useEffect(()=>{ const target = progress*total*SCENERY_SPEED*0.35; distMotion.set(target); },[progress,total])
  useEffect(()=>{ const unsub = smoothDist.on("change", v=> setDist(v)); return unsub },[smoothDist])

  // draw road 60fps
  useEffect(()=>{
    const canvas = canvasRef.current
    if(!canvas) return
    const ctx = canvas.getContext("2d")
    let raf=0
    const draw = ()=>{
      const dpr = window.devicePixelRatio||1
      const w = canvas.clientWidth*dpr, h = canvas.clientHeight*dpr
      if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h }
      const W=w, H=h
      const horizon = H*0.28
      const d = dist
      ctx.clearRect(0,0,W,H)
      // sky
      const grad=ctx.createLinearGradient(0,0,0,horizon)
      grad.addColorStop(0,"#060a0e"); grad.addColorStop(1,"#0e1e18")
      ctx.fillStyle=grad; ctx.fillRect(0,0,W,horizon)
      // stars
      ctx.fillStyle="#a0a0a0"
      for(let sx=0;sx<W;sx+=47*dpr){
        const hsh=(sx*7 + Math.floor(seed*1000))%255
        if(hsh<38){
          const tw=0.6+0.4*Math.sin(d*0.02+sx*0.013)
          if(tw>0.4){ const sy=(hsh%(horizon-8*dpr))+3*dpr; ctx.globalAlpha=0.6+0.4*tw; ctx.beginPath(); ctx.arc(sx,sy,1*dpr,0,Math.PI*2); ctx.fill() }
        }
      }
      ctx.globalAlpha=1
      // hills 3 layers
      const hills=[["#0d1612",0.22,420*dpr,22*dpr,0.018/dpr],["#132019",0.45,360*dpr,18*dpr,0.024/dpr],["#1a2e22",0.85,300*dpr,14*dpr,0.032/dpr]]
      hills.forEach(([col,speed,tile,amp,freq])=>{
        const off=(-d*speed)%tile
        ctx.fillStyle=col; ctx.beginPath()
        ctx.moveTo(-tile+off-20*dpr, horizon)
        for(let x=-tile+off-20*dpr;x<W+tile+20*dpr;x+=10*dpr){
          const bump=amp*Math.sin((x+off*0.7)*freq)+amp*0.45*Math.sin((x+off*0.4)*freq*2.3+1.7)
          ctx.lineTo(x, horizon - Math.max(0,bump))
        }
        ctx.lineTo(W+tile+20*dpr, horizon); ctx.lineTo(-tile+off-20*dpr, horizon); ctx.closePath(); ctx.fill()
      })
      // fog
      ctx.fillStyle="rgba(10,20,16,0.5)"; for(let i=0;i<6;i++){ ctx.fillRect(0,horizon+i*2*dpr,W,2*dpr) }
      ctx.strokeStyle="#1e2e28"; ctx.beginPath(); ctx.moveTo(0,horizon); ctx.lineTo(W,horizon); ctx.stroke()
      // road
      const n=18, visible=140
      const halfNear=260*dpr*(W/620), halfFar=42*dpr*(W/620)
      const centers=[], ys=[], halfs=[]
      for(let i=0;i<n;i++){
        const tlin=i/(n-1), pt=persp(tlin)
        const depth=(1-pt)*visible, wd=d+depth
        let cx=W/2 + roadCenter(wd)
        const maxOff = pt<0.15 ? W/2-halfFar-18*dpr : W/2-30*dpr
        cx=Math.max(W/2-maxOff, Math.min(W/2+maxOff, cx))
        centers.push(cx); ys.push(horizon*(1-pt)+H*pt); halfs.push(halfFar*(1-pt)+halfNear*pt)
      }
      ctx.fillStyle="#1a1a1a"; ctx.strokeStyle="#2a2a2a"; ctx.lineWidth=1*dpr
      ctx.beginPath()
      for(let i=0;i<n;i++) ctx.lineTo(centers[i]-halfs[i], ys[i])
      for(let i=n-1;i>=0;i--) ctx.lineTo(centers[i]+halfs[i], ys[i])
      ctx.closePath(); ctx.fill(); ctx.stroke()
      // shoulders
      ctx.strokeStyle="#3a3a3a"; ctx.lineWidth=2*dpr
      ;[ -1,1].forEach(s=>{ ctx.beginPath(); for(let i=0;i<n;i++){ const x=centers[i]+s*(halfs[i]-8*dpr); if(i==0) ctx.moveTo(x,ys[i]); else ctx.lineTo(x,ys[i]) } ctx.stroke() })
      // dashes scrolling
      const phase=dashPhase.current.v
      ctx.strokeStyle="#00e69a"
      // build segment lens
      const segLens=[]; let totalLen=0
      for(let i=0;i<n-1;i++){ const dx=centers[i+1]-centers[i], dy=ys[i+1]-ys[i]; const L=Math.hypot(dx,dy); segLens.push(L); totalLen+=L }
      const dash=14*dpr, gap=14*dpr, pat=dash+gap, off=phase*pat
      let acc=0
      for(let i=0;i<n-1;i++){
        const seg=segLens[i], a=acc, b=acc+seg
        const k0=Math.floor((a-off)/pat), k1=Math.ceil((b-off)/pat)
        for(let k=k0;k<=k1;k++){
          const d0=k*pat+off, d1=d0+dash, cs=Math.max(a,d0), ce=Math.min(b,d1)
          if(ce-cs<2*dpr) continue
          const f0=(cs-a)/seg, f1=(ce-a)/seg
          const x0=centers[i]*(1-f0)+centers[i+1]*f0, y0=ys[i]*(1-f0)+ys[i+1]*f0
          const x1=centers[i]*(1-f1)+centers[i+1]*f1, y1=ys[i]*(1-f1)+ys[i+1]*f1
          const tmid=(i+0.5)/n, lw=Math.max(1*dpr, 3.2*dpr*(0.35+0.65*tmid))
          ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke()
        }
        acc+=seg
      }
      // scenery
      const spacing=18, visibleAhead=visible
      const start=Math.floor((d-12)/spacing)*spacing, end=d+visibleAhead+18
      for(let wd=start; wd<end; wd+=spacing){
        const depth=wd-d
        if(depth<4||depth>visibleAhead-2) continue
        const t=1-depth/visibleAhead
        const hsh=(Math.floor(seed*100000)+Math.floor(wd))%100000 & 0xFFFFFF
        let kind=hsh%10
        // biome mul simplified
        if(kind<=2 && (hsh>>8)%100>=60) kind=9
        if(kind==3 && (hsh>>12)%100>=50) kind=9
        if(kind>7 && kind!==9) continue
        if(kind==9) continue
        const idxf=t*(n-1), lo=Math.floor(idxf), hi=Math.min(n-1,lo+1), f=idxf-lo
        const cx=centers[lo]*(1-f)+centers[hi]*f, half=halfs[lo]*(1-f)+halfs[hi]*f, y0=ys[lo]*(1-f)+ys[hi]*f
        const scale=0.28+0.72*t, jitter=((hsh>>4)%11)-5, side=(hsh&1? -1:1)
        const baseX=cx+side*(half+14*scale*dpr+jitter*scale*0.5*dpr)
        if(baseX<6*dpr||baseX>W-6*dpr) continue
        if(kind<=2){
          const trW=2*scale*dpr, trH=10*scale*dpr, folH=18*scale*dpr, folW=14*scale*dpr
          ctx.fillStyle="#2b1a0e"; ctx.fillRect(baseX-trW, y0-trH, 2*trW, trH)
          ctx.fillStyle="#1c3a2a"; ctx.beginPath(); ctx.moveTo(baseX, y0-trH-folH); ctx.lineTo(baseX-folW, y0-trH); ctx.lineTo(baseX+folW, y0-trH); ctx.closePath(); ctx.fill()
          ctx.fillStyle="#234832"; ctx.beginPath(); ctx.moveTo(baseX, y0-trH-folH); ctx.lineTo(baseX-folW*0.6, y0-trH-folH*0.55); ctx.lineTo(baseX+folW*0.6, y0-trH-folH*0.55); ctx.closePath(); ctx.fill()
        } else if(kind==3){
          ctx.fillStyle="#1e3320"; ctx.beginPath(); ctx.ellipse(baseX, y0-4*scale*dpr, 12*scale*dpr, 8*scale*dpr,0,0,Math.PI*2); ctx.fill()
        } else if(kind==6){
          ctx.fillStyle="#2b1a0e"; const trW=2*scale*dpr, trH=14*scale*dpr; ctx.fillRect(baseX-trW, y0-trH, 2*trW, trH)
          ctx.fillStyle="#1c3a2a"; const folH=24*scale*dpr, folW=16*scale*dpr; ctx.beginPath(); ctx.moveTo(baseX, y0-trH-folH); ctx.lineTo(baseX-folW, y0-trH); ctx.lineTo(baseX+folW, y0-trH); ctx.fill()
        } else if(kind>=4){
          ctx.strokeStyle="#3a3a3a"; ctx.lineWidth=2*scale*dpr; const ph=16*scale*dpr; ctx.beginPath(); ctx.moveTo(baseX,y0); ctx.lineTo(baseX,y0-ph); ctx.stroke()
          ctx.fillStyle="#c9a86a"; ctx.beginPath(); ctx.ellipse(baseX, y0-ph, 2*scale*dpr, 2*scale*dpr,0,0,Math.PI*2); ctx.fill()
        }
      }
      // car — mini 3/4
      const nearCx=centers[n-1], lean=(centers[n-1]-centers[n-3])*0.10, bob=0.35*Math.sin(Date.now()*0.0022+progress*3)
      let steer=0; if(n>=6) steer=(roadCenter(d+22)-roadCenter(d+6))*0.05
      const scaleCar=0.85, carW=14*scaleCar*dpr, carH=8*scaleCar*dpr
      const carX=Math.max(carW+6*dpr, Math.min(W-carW-6*dpr, nearCx+lean+steer)), carY=H-14*dpr+bob*dpr
      ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.beginPath(); ctx.ellipse(carX, carY+carH-1*dpr, carW, 3*dpr,0,0,Math.PI*2); ctx.fill()
      // body
      ctx.fillStyle="#ffcc33"; ctx.strokeStyle="#ffaa00"; ctx.lineWidth=1*dpr
      ctx.beginPath(); ctx.moveTo(carX-carW, carY-2*dpr); ctx.lineTo(carX+carW, carY-2*dpr); ctx.lineTo(carX+carW-2*dpr, carY+carH-2*dpr); ctx.lineTo(carX-carW+2*dpr, carY+carH-2*dpr); ctx.closePath(); ctx.fill(); ctx.stroke()
      // cabin
      ctx.fillStyle="#1a1e1c"; ctx.beginPath(); ctx.moveTo(carX-carW+4*dpr, carY-carH+1*dpr); ctx.lineTo(carX+carW-4*dpr, carY-carH+1*dpr); ctx.lineTo(carX+carW-6*dpr, carY-2*dpr); ctx.lineTo(carX-carW+6*dpr, carY-2*dpr); ctx.closePath(); ctx.fill()
      ctx.fillStyle="#7ec8e3"; ctx.beginPath(); ctx.moveTo(carX-carW+6*dpr, carY-carH+2*dpr); ctx.lineTo(carX+carW-6*dpr, carY-carH+2*dpr); ctx.lineTo(carX+carW-7*dpr, carY-3*dpr); ctx.lineTo(carX-carW+7*dpr, carY-3*dpr); ctx.closePath(); ctx.fill()
      ctx.strokeStyle="#eafff5"; ctx.lineWidth=1*dpr; ctx.beginPath(); ctx.moveTo(carX-4*dpr, carY-carH+3*dpr); ctx.lineTo(carX-1*dpr, carY-4*dpr); ctx.stroke()
      // wheels
      ctx.fillStyle="#0a0a0a"; for(let dx of [-carW+4*dpr, carW-4*dpr]) for(let dy of [-1*dpr, carH-4*dpr]){ ctx.beginPath(); ctx.arc(carX+dx, carY+dy, 2*dpr,0,Math.PI*2); ctx.fill(); }
      // lights
      ctx.fillStyle="#fff7b2"; ctx.beginPath(); ctx.ellipse(carX-carW+2*dpr, carY-0.5*dpr, 1.5*dpr,1.2*dpr,0,0,Math.PI*2); ctx.fill()
      ctx.beginPath(); ctx.ellipse(carX+carW-2*dpr, carY-0.5*dpr, 1.5*dpr,1.2*dpr,0,0,Math.PI*2); ctx.fill()

      // overlay handled by React
      raf=requestAnimationFrame(draw)
    }
    raf=requestAnimationFrame(draw)
    return ()=>cancelAnimationFrame(raf)
  },[dist, progress, seed])

  function onFinish(){
    // lottie checkmark
    const el=document.getElementById("lottie")
    if(el && window.lottie){
      try{ window.lottie.loadAnimation({container:el, renderer:"svg", loop:false, autoplay:true, path:"https://assets2.lottiefiles.com/packages/lf20_jcikwtux.json"}) }catch{}
    }
    // save via pywebview or fallback
    const data={started_at:new Date().toISOString(), finished_at:new Date().toISOString(), duration_min:Math.round(total/60), intent:intent||"(no intent)", route:routeName, completed:true, sound_on:false}
    if(window.pywebview && window.pywebview.api && window.pywebview.api.save_session){
      window.pywebview.api.save_session(data)
    } else {
      // Pages fallback: store in localStorage and offer download
      try{ const arr=JSON.parse(localStorage.getItem("rf_sessions")||"[]"); arr.push(data); localStorage.setItem("rf_sessions", JSON.stringify(arr.slice(-50))) }catch{}
    }
  }

  const fmt=(s)=>{ const m=Math.floor(s/60), sc=s%60; return String(m).padStart(2,"0")+":"+String(sc).padStart(2,"0") }

  return (
    <div style={{height:"100%",display:"flex",flexDirection:"column"}}>
      <header><h1>ROADTRIP FOCUS</h1><p>pick a route · set your intent · drive</p><div className="phase">{isRunning? `On the road — ${routeName}`: "Ready to roll"}</div></header>
      <div className="topbar"><button className="topbar" onClick={()=>document.documentElement.requestFullscreen?.() || document.body.requestFullscreen?.()}>Fullscreen</button></div>
      <div className="canvas-wrap"><canvas ref={canvasRef} style={{width:"100%",height:"100%"}}/><div id="lottie" style={{position:"absolute",left:"50%",top:"45%",width:120,height:120,transform:"translate(-50%,-50%)",pointerEvents:"none"}}></div>
        <div className="hud"><div className="hud-card hud-top"><span>{intent||"No intent"}</span><span style={{color:THEME.muted, fontSize:11}}>{routeName} · {routeMin} min</span></div>
        {isFullscreen && <div className="hud-card hud-bottom"><span style={{color:THEME.accent, fontFamily:"Consolas", fontWeight:800}}>{fmt(remaining)}</span><div className="bar" style={{width:200}}><div className="fill" style={{width:`${progress*100}%`}}/></div><button onClick={()=>setIsFullscreen(false)}>Exit</button></div>}</div>
      </div>
      <div className="intent"><label>Intent</label><input value={intent} onChange={e=>setIntent(e.target.value)} placeholder='e.g. "finish problem set 3.1"'/></div>
      <div className="route"><label>Route</label><select value={routeName} onChange={e=>{ const v=e.target.value; const r=ROUTES.find(x=>x[0]==v); if(r){ setRouteName(r[0]); setRouteMin(r[1]); setTotal(r[1]*60); setRemaining(r[1]*60); setSeed(Math.random()) } }}>{ROUTES.map(r=><option key={r[0]} value={r[0]}>{r[0]} · {r[1]} min</option>)}</select><span style={{color:THEME.muted, fontSize:11}}>{ROUTES.find(r=>r[0]==routeName)?.[2]}</span></div>
      <div className="timer-row"><div className="time-card"><div className="time">{fmt(remaining)}</div><div className="cap">mm:ss (click to edit)</div></div><div className="progress-card"><div className="bar"><motion.div className="fill" animate={{width:`${progress*100}%`}} transition={{type:"spring",stiffness:120,damping:18}}/></div></div></div>
      <div className="controls"><motion.button whileTap={{scale:0.97}} className="btn primary" disabled={isRunning} onClick={()=>{ setIsRunning(true); setSeed(Math.random()) }}>Hit the road</motion.button><button className="btn" onClick={()=>setIsPaused(p=>!p)} disabled={!isRunning}>{isPaused?"Resume":"Pause"}</button><button className="btn" onClick={()=>{ setIsRunning(false); setIsPaused(false); setRemaining(total); setSeed(Math.random()) }}>Reset</button></div>
      <div className="sound"><label><input type="checkbox"/> Road hum</label><input type="range" min="0" max="0.5" step="0.02"/></div>
      <div className="quick">{[25,50,90].map(m=><button key={m} className={`pill ${routeMin===m?"active":""}`} onClick={()=>{ setRouteMin(m); const r=ROUTES.find(x=>x[1]==m); if(r) setRouteName(r[0]); setTotal(m*60); setRemaining(m*60)}}>{m}m</button>)}<button className="pill" onClick={()=>{ const v=prompt("Custom minutes 1-180"); const n=parseInt(v); if(n>=1&&n<=180){ setRouteName(`Custom · ${n}m`); setRouteMin(n); setTotal(n*60); setRemaining(n*60)} }}>Custom</button></div>
      <div className="quote">“{["Focus is a muscle","Small consistent sessions beat long distracted ones","Deep work now, freedom later"][Math.floor(Date.now()/8000)%3]}”</div>
      <div className="stats"><span>Trips: — · Road time: —</span><span><button>Clear log</button> <button>Trip Log</button></span></div>
    </div>
  )
}
createRoot(document.getElementById("root")).render(<App/>)
</script>
</body>
</html>
